# nixpacks.toml - Railway deployment configuration
[phases.setup]
nixPkgs = [
  "chromium",
  "nss",
  "nspr",
  "at-spi2-atk",
  "cups",
  "libdrm",
  "libxcomposite",
  "libxdamage",
  "libxrandr",
  "mesa",
  "alsa-lib",
  "pango",
  "cairo",
  "xorg.libxcb",
  "xorg.libxkbcommon",
  "xorg.libX11",
  "xorg.libXcursor",
  "xorg.libXext",
  "xorg.libXfixes",
  "xorg.libXi",
  "xorg.libXrender",
  "xorg.libXtst",
  "xorg.libXScrnSaver",
  "gtk3",
  "expat"
]

[phases.install]
cmds = ["npm install --legacy-peer-deps"]

[phases.build]
cmds = ["echo 'Build complete'"]

[variables]
PUPPETEER_SKIP_CHROMIUM_DOWNLOAD = "true"
PUPPETEER_SKIP_DOWNLOAD = "true"
NPM_CONFIG_LEGACY_PEER_DEPS = "true"
NODE_ENV = "production"

[start]
cmd = "node server.js"
